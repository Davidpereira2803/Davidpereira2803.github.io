name: Verify portfolio
on:
  push:
    branches-ignore: [main]
    paths-ignore: ['.review/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/validate-project.mjs data/projects/imposter-hunt.json
      - name: Install browser checks
        run: |
          npm install --no-save --package-lock=false playwright
          npx playwright install --with-deps chromium
      - name: Check workstation interactions
        run: |
          python3 -m http.server 4173 --directory out > /tmp/portfolio-http.log 2>&1 &
          node scripts/verify-workstation.mjs
      - name: Upload preview and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: retro-workstation-preview
          path: |
            out
            .review
